<!DOCTYPE html>
<html>

<head>
    <title>BMI Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-success">
    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card shadow p-4" style="width: 400px;">
            <h2 class="text-center text-dark mb-4"> BMI Calculator </h2>
            <div class="mb-3">
                <label class="text-dark" class="form-label">Height (cm)</label>
                <input type="number" id="height" class="form-control" placeholder="Enter height">
            </div>
            <div class="mb-3">
                <label class="text-dark" class="form-label">Weight (kg)</label>
                <input type="number" id="weight" class="form-control" placeholder="Enter weight">
            </div>
            <div class="d-flex gap-2">
                <button class="btn btn-warning w-100" onclick="onAddBtnclick()"> Calculate</button>
                <button class="btn btn-success w-100" onclick="onDeleteBtnclick()"> Clear </button>
            </div>

            <div>
                <h4 id="bmiText" class="text-center mt-4">BMI</h4>
                <h5 id="categoryText" class="text-center">Category</h5>
            </div>
        </div>
    </div>
    <script src="./script.js"></script>
</body>

</html>
